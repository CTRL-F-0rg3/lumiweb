<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="galaxy" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="45%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </radialGradient>
    <radialGradient id="orb" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#9fd8ff"/>
      <stop offset="65%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#2a1a7a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#galaxy)"/>
  <!-- Stars -->
  <circle cx="48" cy="68" r="1.5" fill="#fff" opacity="0.75"/>
  <circle cx="208" cy="56" r="1.2" fill="#fff" opacity="0.65"/>
  <circle cx="228" cy="188" r="1.8" fill="#fff" opacity="0.8"/>
  <circle cx="36" cy="196" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="128" cy="30" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="192" cy="228" r="1.3" fill="#fff" opacity="0.65"/>
  <circle cx="60" cy="150" r="1" fill="#fff" opacity="0.55"/>
  <circle cx="200" cy="120" r="1.1" fill="#fff" opacity="0.6"/>
  <!-- Glass rim -->
  <rect x="4" y="4" width="248" height="248" rx="52" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="10" y="10" width="236" height="236" rx="46" fill="none"
        stroke="rgba(180,215,255,0.08)" stroke-width="1"/>
  <!-- Orb -->
  <circle cx="128" cy="128" r="54" fill="url(#orb)" filter="url(#glow)"/>
  <!-- Specular highlight -->
  <ellipse cx="110" cy="110" rx="20" ry="15" fill="white" opacity="0.55"
           transform="rotate(-30 110 110)"/>
  <ellipse cx="112" cy="112" rx="7" ry="5" fill="white" opacity="0.85"
           transform="rotate(-30 112 112)"/>
</svg>
